<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись продажи ДВС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --input-bg: var(--tg-theme-secondary-bg-color, #f2f3f5);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --border: #d7d8dc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .hidden {
      display: none;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row > div {
      flex: 1;
    }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <form id="saleForm">
    <div class="field">
      <label>Модель двигателя *</label>
      <input type="text" id="model" placeholder="Например: 1ZZ-FE, 4A91, G4FC" required>
    </div>

    <div class="field">
      <label>Номер двигателя *</label>
      <input type="text" id="number" placeholder="Номер ДВС" required>
    </div>

    <div class="field">
      <label>Стоимость (руб.) *</label>
      <input type="text" id="price" placeholder="Например: 120000 или 120.000" required>
    </div>

    <div class="field">
      <label>Способ оплаты *</label>
      <select id="paymentType" onchange="onPaymentChange()" required>
        <option value="cash">Наличные</option>
        <option value="transfer">Перевод</option>
        <option value="split">Раздельная (нал + перевод)</option>
        <option value="rs">Расчетный счет (+10%)</option>
        <option value="credit">Рассрочка</option>
      </select>
    </div>

    <!-- Банк для перевода -->
    <div class="field hidden" id="bankBlock">
      <label>Банк получения перевода *</label>
      <select id="bankSelect">
        <option value="Сбербанк">Сбербанк</option>
        <option value="Озон Банк">Озон Банк</option>
        <option value="Альфа-Банк">Альфа-Банк</option>
      </select>
    </div>

    <!-- Блок раздельной оплаты -->
    <div id="splitBlock" class="hidden">
      <div class="row field">
        <div>
          <label>Сумма нал *</label>
          <input type="text" id="splitCash" placeholder="Наличные (руб.)">
        </div>
        <div>
          <label>Сумма перевод *</label>
          <input type="text" id="splitTransfer" placeholder="Перевод (руб.)">
        </div>
      </div>
      <div class="field">
        <label>Банк для перевода *</label>
        <select id="splitBankSelect">
          <option value="Сбербанк">Сбербанк</option>
          <option value="Озон Банк">Озон Банк</option>
          <option value="Альфа-Банк">Альфа-Банк</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Источник клиента *</label>
      <select id="source" required>
        <option value="Постоянный клиент">Постоянный клиент</option>
        <option value="Сарафан">Сарафан</option>
        <option value="Авито">Авито</option>
        <option value="Drom">Drom</option>
        <option value="Сайт">Сайт</option>
      </select>
    </div>

    <div class="field">
      <label>Номер договора *</label>
      <input type="text" id="contract" placeholder="№ Договора" required>
    </div>

    <div class="field">
      <label>Способ забора / доставки *</label>
      <select id="delivType" onchange="onDeliveryChange()" required>
        <option value="pickup">Самовывоз</option>
        <option value="service">Доставка до сервиса</option>
        <option value="tk">Доставка до ТК</option>
        <option value="intercity">Доставка в другой город нашими силами</option>
      </select>
    </div>

    <!-- Одиночное поле для сервиса или межгорода -->
    <div class="field hidden" id="delivDetailsBlock">
      <label id="delivLabel">Уточнение доставки *</label>
      <input type="text" id="delivDetails" placeholder="Укажите детали">
    </div>

    <!-- Двойной блок для ТК -->
    <div id="tkBlock" class="hidden">
      <div class="row field">
        <div>
          <label>Транспортная компания *</label>
          <input type="text" id="tkName" list="tkList" placeholder="Выберите или введите ТК">
          <datalist id="tkList">
            <option value="ПЭК">
            <option value="Деловые Линии">
            <option value="КИТ (GTD)">
            <option value="Энергия">
            <option value="Луч">
            <option value="Другое">
          </datalist>
        </div>
        <div>
          <label>В какой город *</label>
          <input type="text" id="tkCity" placeholder="Например: в Вологду">
        </div>
      </div>
    </div>

    <div class="field">
      <label>Покупатель (ФИО и номер телефона)</label>
      <input type="text" id="client" placeholder="Иван +79991234567 (необязательно)">
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">Сохранить и отправить</button>
  </form>

  <script>
    // === НАСТРОЙКИ ===
    const BOT_TOKEN = "8456414881:AAFQWFUnDmtI5R-2gRYnWFGdrptZwIcqQdk";
    const TARGET_CHAT_ID = "-1003268855842";
    const APP_LINK = "https://t.me/fm_sales_reg_bot/sales";

    const tg = window.Telegram.WebApp;
    tg.expand();

    function parseNumericPrice(str) {
      if (!str) return 0;
      let cleaned = str.toString().replace(/\s+/g, '').replace(/\./g, '').replace(',', '.');
      return parseFloat(cleaned) || 0;
    }

    function formatNumber(num) {
      return num.toLocaleString('ru-RU');
    }

    function onPaymentChange() {
      const val = document.getElementById('paymentType').value;
      document.getElementById('bankBlock').classList.toggle('hidden', val !== 'transfer');
      document.getElementById('splitBlock').classList.toggle('hidden', val !== 'split');
    }

    function onDeliveryChange() {
      const val = document.getElementById('delivType').value;
      const singleBlock = document.getElementById('delivDetailsBlock');
      const singleLabel = document.getElementById('delivLabel');
      const singleInput = document.getElementById('delivDetails');
      const tkBlock = document.getElementById('tkBlock');
      const tkNameInput = document.getElementById('tkName');
      const tkCityInput = document.getElementById('tkCity');

      singleBlock.classList.add('hidden');
      singleInput.required = false;
      tkBlock.classList.add('hidden');
      tkNameInput.required = false;
      tkCityInput.required = false;

      if (val === 'service') {
        singleBlock.classList.remove('hidden');
        singleInput.required = true;
        singleLabel.innerText = 'Адрес сервиса (в скобках) *';
        singleInput.placeholder = 'Адрес сервиса или название';
      } else if (val === 'tk') {
        tkBlock.classList.remove('hidden');
        tkNameInput.required = true;
        tkCityInput.required = true;
      } else if (val === 'intercity') {
        singleBlock.classList.remove('hidden');
        singleInput.required = true;
        singleLabel.innerText = 'Город доставки (в скобках) *';
        singleInput.placeholder = 'Например: Пермь, Тюмень, Челябинск';
      }
    }

    document.getElementById('saleForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Отправка...';

      let rawPrice = document.getElementById('price').value.trim();
      let basePrice = parseNumericPrice(rawPrice);
      let pType = document.getElementById('paymentType').value;
      let payDesc = '';

      if (pType === 'cash') {
        payDesc = 'Наличные';
      } else if (pType === 'transfer') {
        payDesc = `Перевод (${document.getElementById('bankSelect').value})`;
      } else if (pType === 'split') {
        let c = parseNumericPrice(document.getElementById('splitCash').value);
        let t = parseNumericPrice(document.getElementById('splitTransfer').value);
        let b = document.getElementById('splitBankSelect').value;
        payDesc = `Раздельная (Нал: ${formatNumber(c)} ₽ | Перевод: ${formatNumber(t)} ₽ на ${b})`;
      } else if (pType === 'rs') {
        let rsSum = Math.round(basePrice * 1.1);
        payDesc = `Р/С (+10%): ${formatNumber(rsSum)} ₽`;
        basePrice = rsSum;
      } else if (pType === 'credit') {
        payDesc = 'Рассрочка';
      }

      let dType = document.getElementById('delivType').value;
      let deliveryFormatted = 'Самовывоз';

      if (dType === 'service') {
        let details = document.getElementById('delivDetails').value.trim();
        deliveryFormatted = `Доставка до сервиса (${details})`;
      } else if (dType === 'tk') {
        let tk = document.getElementById('tkName').value.trim();
        let city = document.getElementById('tkCity').value.trim();
        deliveryFormatted = `Доставка до ТК ${tk} (${city})`;
      } else if (dType === 'intercity') {
        let details = document.getElementById('delivDetails').value.trim();
        deliveryFormatted = `Доставка в другой город нашими силами (${details})`;
      }

      // Определение имени и автозамена Factory Motors -> Антон
      const user = tg.initDataUnsafe?.user;
      let authorName = user ? `${user.first_name || ''} ${user.last_name || ''}`.trim() : 'Менеджер';
      if (!authorName || authorName.toLowerCase().includes('factory motors')) {
        authorName = 'Антон';
      }

      const textMessage = 
        `📋 <b>НОВАЯ ПРОДАЖА</b>\n` +
        `(Менеджер: ${authorName})\n\n` +
        `▫️ <b>Модель ДВС:</b> ${document.getElementById('model').value.trim()}\n` +
        `▫️ <b>Номер ДВС:</b> ${document.getElementById('number').value.trim()}\n` +
        `▫️ <b>Цена:</b> ${formatNumber(basePrice)} ₽\n` +
        `▫️ <b>Оплата:</b> ${payDesc}\n` +
        `▫️ <b>Источник:</b> ${document.getElementById('source').value}\n` +
        `▫️ <b>Номер договора:</b> ${document.getElementById('contract').value.trim()}\n` +
        `▫️ <b>Доставка/самовывоз:</b> ${deliveryFormatted}\n` +
        `▫️ <b>Покупатель:</b> ${document.getElementById('client').value.trim() || '—'}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TARGET_CHAT_ID,
            text: textMessage,
            parse_mode: 'HTML',
            reply_markup: {
              inline_keyboard: [
                [
                  {
                    text: "📝 Записать новую продажу",
                    url: APP_LINK
                  }
                ]
              ]
            }
          })
        });

        const result = await response.json();

        if (response.ok && result.ok) {
          tg.close();
        } else {
          alert('Ошибка отправки: ' + (result.description || JSON.stringify(result)));
          btn.disabled = false;
          btn.innerText = 'Сохранить и отправить';
        }
      } catch (err) {
        alert('Ошибка сети: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Сохранить и отправить';
      }
    });
  </script>
</body>
</html>
